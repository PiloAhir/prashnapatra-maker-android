name: Build Prashnapatra Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract Android project
        run: |
          unzip -q prashnapatra_android_starter.zip -d /tmp/starter
          cp -R /tmp/starter/prashnapatra_android_starter/. .

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prashnapatra-maker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
